<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Jodi Porutham</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        .admin-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .admin-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(22, 33, 62, 0.95);
            padding: 25px;
            border-radius: 20px;
            border: 1px solid rgba(255, 207, 75, 0.3);
            text-align: center;
        }

        .stat-value {
            font-size: 3rem;
            font-weight: 800;
            color: var(--accent-gold);
            margin: 10px 0;
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .chart-container {
            background: rgba(22, 33, 62, 0.95);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(255, 207, 75, 0.3);
            margin-bottom: 30px;
        }

        .data-table {
            width: 100%;
            background: rgba(22, 33, 62, 0.95);
            border-radius: 20px;
            overflow: hidden;
        }

        .data-table table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th {
            background: rgba(255, 207, 75, 0.1);
            padding: 15px;
            text-align: left;
            color: var(--accent-gold);
            font-weight: 600;
        }

        .data-table td {
            padding: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
        }

        .export-btn {
            margin-bottom: 20px;
        }

        .loading-spinner {
            text-align: center;
            padding: 50px;
        }

        .spinner {
            border: 4px solid rgba(255, 207, 75, 0.1);
            border-top: 4px solid var(--accent-gold);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="admin-container">
        <div class="admin-header">
            <h1>🔐 Admin Dashboard</h1>
            <p class="tagline">Jodi Porutham Analytics & Insights</p>
            <button onclick="handleAdminLogout()" class="btn-secondary">Logout</button>
        </div>

        <div id="loadingSpinner" class="loading-spinner">
            <div class="spinner"></div>
            <p style="color: var(--text-muted); margin-top: 20px;">Loading data...</p>
        </div>

        <div id="adminContent" style="display: none;">
            <!-- Stats Grid -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Total Users</div>
                    <div class="stat-value" id="totalUsers">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Total Tests</div>
                    <div class="stat-value" id="totalTests">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Average Score</div>
                    <div class="stat-value" id="avgScore">0%</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Today's Tests</div>
                    <div class="stat-value" id="todayTests">0</div>
                </div>
            </div>

            <!-- Charts -->
            <div class="chart-container">
                <h3>📊 Tests Over Time</h3>
                <canvas id="testsChart"></canvas>
            </div>

            <div class="chart-container">
                <h3>💯 Score Distribution</h3>
                <canvas id="scoresChart"></canvas>
            </div>

            <!-- Recent Tests Table -->
            <button class="btn-primary export-btn" onclick="exportData()">
                📥 Export All Data (CSV)
            </button>

            <div class="data-table">
                <h3 style="padding: 20px;">📝 Recent Tests</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>User</th>
                            <th>Type</th>
                            <th>Score</th>
                            <th>Dialogue</th>
                        </tr>
                    </thead>
                    <tbody id="recentTestsTable">
                        <!-- Filled by JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        const ADMIN_EMAIL = "YOUR_ADMIN_EMAIL@example.com"; // Change this to your email

        // Check if user is admin
        firebase.auth().onAuthStateChanged(async (user) => {
            if (!user || user.email !== ADMIN_EMAIL) {
                alert('❌ Access Denied. Admins only!');
                window.location.href = 'auth.html';
                return;
            }

            // Load admin data
            await loadAdminData();
        });

        async function loadAdminData() {
            try {
                // Fetch stats
                const statsDoc = await firebase.firestore().collection('analytics').doc('stats').get();
                const stats = statsDoc.data() || { totalTests: 0, avgScore: 0 };

                // Fetch users count
                const usersSnapshot = await firebase.firestore().collection('users').get();
                const totalUsers = usersSnapshot.size;

                // Fetch tests from last 30 days
                const thirtyDaysAgo = new Date();
                thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);

                const testsSnapshot = await firebase.firestore().collection('tests')
                    .where('timestamp', '>=', firebase.firestore.Timestamp.fromDate(thirtyDaysAgo))
                    .orderBy('timestamp', 'desc')
                    .limit(100)
                    .get();

                const tests = [];
                testsSnapshot.forEach(doc => {
                    tests.push({ id: doc.id, ...doc.data() });
                });

                // Calculate today's tests
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                const todayTests = tests.filter(t => t.timestamp?.toDate() >= today).length;

                // Update stats
                document.getElementById('totalUsers').textContent = totalUsers;
                document.getElementById('totalTests').textContent = stats.totalTests || tests.length;
                document.getElementById('avgScore').textContent = (stats.avgScore || 0) + '%';
                document.getElementById('todayTests').textContent = todayTests;

                // Render charts
                renderTestsChart(tests);
                renderScoresChart(tests);

                // Render table
                renderRecentTestsTable(tests.slice(0, 20));

                // Hide loading, show content
                document.getElementById('loadingSpinner').style.display = 'none';
                document.getElementById('adminContent').style.display = 'block';

            } catch (error) {
                console.error('Error loading admin data:', error);
                alert('Error loading data: ' + error.message);
            }
        }

        function renderTestsChart(tests) {
            const ctx = document.getElementById('testsChart').getContext('2d');

            // Group by date
            const dateMap = {};
            tests.forEach(test => {
                if (test.timestamp) {
                    const date = test.timestamp.toDate().toLocaleDateString();
                    dateMap[date] = (dateMap[date] || 0) + 1;
                }
            });

            const dates = Object.keys(dateMap).sort();
            const counts = dates.map(date => dateMap[date]);

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: dates,
                    datasets: [{
                        label: 'Tests Per Day',
                        data: counts,
                        borderColor: '#ffcf4b',
                        backgroundColor: 'rgba(255, 207, 75, 0.1)',
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: { beginAtZero: true, ticks: { color: '#b2becd' }, grid: { color: 'rgba(255,255,255,0.05)' } },
                        x: { ticks: { color: '#b2becd' }, grid: { display: false } }
                    }
                }
            });
        }

        function renderScoresChart(tests) {
            const ctx = document.getElementById('scoresChart').getContext('2d');

            // Group by score ranges
            const ranges = {
                '0-20': 0,
                '21-40': 0,
                '41-60': 0,
                '61-80': 0,
                '81-100': 0
            };

            tests.forEach(test => {
                if (test.score !== undefined) {
                    if (test.score <= 20) ranges['0-20']++;
                    else if (test.score <= 40) ranges['21-40']++;
                    else if (test.score <= 60) ranges['41-60']++;
                    else if (test.score <= 80) ranges['61-80']++;
                    else ranges['81-100']++;
                }
            });

            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: Object.keys(ranges),
                    datasets: [{
                        label: 'Number of Tests',
                        data: Object.values(ranges),
                        backgroundColor: [
                            'rgba(255, 75, 43, 0.6)',
                            'rgba(255, 152, 0, 0.6)',
                            'rgba(255, 207, 75, 0.6)',
                            'rgba(76, 175, 80, 0.6)',
                            'rgba(33, 150, 243, 0.6)'
                        ],
                        borderColor: '#ffcf4b',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: { beginAtZero: true, ticks: { color: '#b2becd' }, grid: { color: 'rgba(255,255,255,0.05)' } },
                        x: { ticks: { color: '#b2becd' }, grid: { display: false } }
                    }
                }
            });
        }

        function renderRecentTestsTable(tests) {
            const tbody = document.getElementById('recentTestsTable');
            tbody.innerHTML = tests.map(test => `
                <tr>
                    <td>${test.timestamp?.toDate().toLocaleDateString() || 'N/A'}</td>
                    <td>${test.userId?.substring(0, 8)}...</td>
                    <td>${test.type || 'Unknown'}</td>
                    <td>${test.score || 'N/A'}%</td>
                    <td>${(test.dialogue || 'N/A').substring(0, 50)}...</td>
                </tr>
            `).join('');
        }

        async function exportData() {
            try {
                const testsSnapshot = await firebase.firestore().collection('tests').get();
                const tests = [];
                testsSnapshot.forEach(doc => {
                    tests.push(doc.data());
                });

                // Convert to CSV
                const csv = convertToCSV(tests);
                downloadCSV(csv, 'jodi-porutham-data.csv');

                alert('✅ Data exported successfully!');
            } catch (error) {
                alert('❌ Export failed: ' + error.message);
            }
        }

        function convertToCSV(data) {
            const headers = ['Date', 'User ID', 'Type', 'Score', 'Dialogue'];
            const rows = data.map(item => [
                item.timestamp?.toDate().toISOString() || '',
                item.userId || '',
                item.type || '',
                item.score || '',
                (item.dialogue || '').replace(/"/g, '""')
            ]);

            return [
                headers.join(','),
                ...rows.map(row => row.map(cell => `"${cell}"`).join(','))
            ].join('\n');
        }

        function downloadCSV(csv, filename) {
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            window.URL.revokeObjectURL(url);
        }

        function handleAdminLogout() {
            firebase.auth().signOut().then(() => {
                window.location.href = 'auth.html';
            });
        }
    </script>
</body>

</html>
